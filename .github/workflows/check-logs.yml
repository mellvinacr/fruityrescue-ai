name: Check AI Container Logs
on:
  workflow_dispatch:

jobs:
  check-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch AI Service Logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_AI_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            docker logs --tail 100 fruityrescue-ai-container
            echo "--- Container Status ---"
            docker ps -a | grep fruityrescue-ai-container
            echo "--- Memory Info ---"
            free -m
