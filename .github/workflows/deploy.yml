# Triggering a fresh run with new GitHub secrets loaded
name: FruityRescue CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push all images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Amankan disk space runner sebelum melakukan build berat Next.js
          docker system prune -f || true

          # 1. Build & Push Backend API
          docker build -t $ECR_REGISTRY/fruityrescue-backend:latest -f ./backend/Dockerfile ./backend
          docker push $ECR_REGISTRY/fruityrescue-backend:latest
          
          # 2. Build & Push AI Service
          docker build -t $ECR_REGISTRY/fruityrescue-backend:fruity-ai-latest -f ./ai-service/Dockerfile ./ai-service
          docker push $ECR_REGISTRY/fruityrescue-backend:fruity-ai-latest

          # 3. Build & Push Frontend Next.js (Menyuntikkan URL Backend AWS secara permanen ke dalam static build Next.js)
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="http://52.77.218.147:8000" \
            -t $ECR_REGISTRY/fruityrescue-frontend:latest \
            -f ./frontend/Dockerfile ./frontend
          docker push $ECR_REGISTRY/fruityrescue-frontend:latest

  deploy-apps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Containers to EC2 Backend Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION
          script: |
            export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            export AWS_DEFAULT_REGION=$AWS_REGION
            
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 212712010930.dkr.ecr.$AWS_REGION.amazonaws.com
            
            # Matikan dan hapus container lama dengan paksa (-f)
            docker stop fruityrescue-backend-container fruityrescue-frontend-container || true
            docker rm -f fruityrescue-backend-container fruityrescue-frontend-container || true
            docker system prune -a --volumes -f || true
            
            # 🚀 Pull dan Jalankan BACKEND API (Port 8000)
            docker pull 212712010930.dkr.ecr.$AWS_REGION.amazonaws.com/fruityrescue-backend:latest
            docker run -d \
              --name fruityrescue-backend-container \
              -p 8000:8000 \
              -e AI_SERVICE_URL=${{ secrets.AI_SERVICE_URL }} \
              -e DB_HOST=fruityrescue-db.cr0cewgckhrn.ap-southeast-1.rds.amazonaws.com \
              -e DB_PORT=5432 \
              -e DB_USER=postgres \
              -e DB_PASSWORD=fruitypassword123 \
              -e DB_NAME=fruityrescue \
              -e R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }} \
              -e R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }} \
              -e R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }} \
              -e R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }} \
              -e BACKEND_PUBLIC_URL=https://fruityrescue-ai.pages.dev/api \
              -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              -e GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }} \
              212712010930.dkr.ecr.$AWS_REGION.amazonaws.com/fruityrescue-backend:latest

            # 🚀 Pull dan Jalankan FRONTEND Next.js
            docker pull 212712010930.dkr.ecr.$AWS_REGION.amazonaws.com/fruityrescue-frontend:latest
            docker run -d \
              --name fruityrescue-frontend-container \
              -p 80:3000 \
              212712010930.dkr.ecr.$AWS_REGION.amazonaws.com/fruityrescue-frontend:latest

      - name: Deploy AI Service Container to EC2 AI Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_AI_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION
          script: |
            export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            export AWS_DEFAULT_REGION=$AWS_REGION
            
            # CEGAH OUT OF MEMORY (OOM) DENGAN MENAMBAH 2GB SWAP FILE SECARA OTOMATIS
            if [ $(sudo swapon --show | wc -l) -eq 0 ]; then
              echo "Membuat Swap File 2GB untuk menampung Model AI..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 212712010930.dkr.ecr.$AWS_REGION.amazonaws.com
            
            # Matikan dan hapus container lama dengan paksa (-f)
            docker stop fruityrescue-ai-container || true
            docker rm -f fruityrescue-ai-container || true
            docker system prune -a --volumes -f || true
            
            docker pull 212712010930.dkr.ecr.$AWS_REGION.amazonaws.com/fruityrescue-backend:fruity-ai-latest
            
            # Note: Map port 7860 (EC2 Host) to 8001 (Container Uvicorn port)
            docker run -d \
              --name fruityrescue-ai-container \
              -p 7860:8001 \
              -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              -e GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }} \
              212712010930.dkr.ecr.$AWS_REGION.amazonaws.com/fruityrescue-backend:fruity-ai-latest